[build]
  command = "node scripts/generate-supabase-config.mjs"
  publish = "."

[[redirects]]
  from = "/directory/:slug"
  to = "/directory/listing.html"
  status = 200

[[redirects]]
  from = "/directory/:slug/"
  to = "/directory/listing.html"
  status = 200

[[redirects]]
  from = "/:username"
  to = "/members/index.html"
  status = 200

[[redirects]]
  from = "/:username/"
  to = "/members/index.html"
  status = 200
