<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victoria Freediving Logo Preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7f9;
      color: #172026;
    }

    body {
      margin: 0;
      padding: 32px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .item {
      display: grid;
      gap: 10px;
      align-content: center;
      min-height: 180px;
      padding: 16px;
      border: 1px solid #d8e1e8;
      border-radius: 8px;
      background: #ffffff;
    }

    .logo-box {
      display: grid;
      place-items: center;
      min-height: 110px;
      padding: 12px;
      border-radius: 6px;
      background: #102a43;
    }

    img {
      max-width: 100%;
      max-height: 100px;
      object-fit: contain;
    }

    .name {
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <h1>Victoria Freediving Logo Preview</h1>
  <main class="grid">
    <section class="item"><div class="logo-box"><img src="salt-sessions-freediving.png" alt="Salt Sessions Freediving"></div><div class="name">Salt Sessions Freediving</div></section>
    <section class="item"><div class="logo-box"><img src="liv-for-the-sea.png" alt="Liv For The Sea"></div><div class="name">Liv For The Sea</div></section>
    <section class="item"><div class="logo-box"><img src="drifters-freediving.png" alt="Drifters Freediving"></div><div class="name">Drifters Freediving</div></section>
    <section class="item"><div class="logo-box"><img src="freediving-australia.svg" alt="Freediving Australia Melbourne"></div><div class="name">Freediving Australia Melbourne</div></section>
    <section class="item"><div class="logo-box"><img src="marlon-quinn-boundless-blue.png" alt="Marlon Quinn / Boundless Blue"></div><div class="name">Marlon Quinn / Boundless Blue</div></section>
    <section class="item"><div class="logo-box"><img src="scubabo-dive-victoria.svg" alt="Scubabo Dive Victoria"></div><div class="name">Scubabo Dive Victoria</div></section>
    <section class="item"><div class="logo-box"><img src="simple-dive-melbourne.png" alt="Simple Dive Melbourne"></div><div class="name">Simple Dive Melbourne</div></section>
    <section class="item"><div class="logo-box"><img src="melbourne-freedivers-club.png" alt="Melbourne Freedivers Club"></div><div class="name">Melbourne Freedivers Club</div></section>
    <section class="item"><div class="logo-box"><img src="geelong-freedivers.webp" alt="Geelong Freedivers"></div><div class="name">Geelong Freedivers</div></section>
    <section class="item"><div class="logo-box"><img src="southern-freedivers.svg" alt="Southern Freedivers"></div><div class="name">Southern Freedivers</div></section>
  </main>
</body>
</html>
